<!-- 4. 2-pane, both meet in middle -->
<div class="window-container{{ if .wide }} wide{{ end }}" data-mode="DH">
    {{ if .motorised }}
    <div class="motorised">
        <span class="mdi mdi-remote"></span>
    </div>
    {{ end }}
    <div class="pane" data-pos="1"></div>
    <div class="pane" data-pos="2"></div>
</div>
