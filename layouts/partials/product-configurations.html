{{ with .Params.configurations }}
    <ul class="row list-unstyled">
      {{ range . }}
        <li class="col-6 col-md-4 col-lg-3 mb-4">
          <a href="{{ .url | relURL }}" class="text-decoration-none text-center d-block">
            <img src="{{ .image | relURL }}" alt="{{ .name }}" class="img-fluid w-100 mb-2 rounded shadow-sm">
            <div class="fw-semibold text-dark">{{ .name }}</div>
          </a>
        </li>
      {{ end }}
    </ul>
{{ end }}
