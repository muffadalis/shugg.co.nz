<div class="factory-closure-banner">
    <span class="banner-text">ⓘ Factory closed</span>
    <button onclick="dismissBanner()" class="dismiss-btn">Dismiss</button>
</div>

<style>
    .factory-closure-banner {
        background-color: #185fa5;
        color: #e6f1fb;
        border-bottom: 5px solid #dde8f2;
        text-align: center;
        padding: 12px;
        font-family: Poppins;
    }

    .dismiss-btn {
        margin-left: 15px;
        background: rgba(255, 255, 255, 0.2);
        border: none;
        color: white;
        padding: 5px 15px;
        cursor: pointer;
        font-weight: normal;
        border-radius: 3px;
    }

    .dismiss-btn:hover {
        background: rgba(255, 255, 255, 0.3);
    }
</style>

<script>
    //--------------------------------------------------------------------------
    //  Configuration - set your banner and break dates here
    //--------------------------------------------------------------------------
    const bannerStart = new Date("2026-04-29");
    const bannerEnd = new Date("2026-06-25");

    const breakStart = new Date("2026-06-16");
    const breakEnd = new Date("2026-06-24");
    //--------------------------------------------------------------------------

    const today = new Date();

    // simple ordinal helper
    function ordinal(n) {
        const s = ["th", "st", "nd", "rd"];
        const v = n % 100;
        return n + (s[(v - 20) % 10] || s[v] || s[0]);
    }

    // format like "22nd Dec 2025" or "9th of Jan 2026" when includeOf=true
    function formatDate(d, includeOf = false) {
        const day = ordinal(d.getDate());
        const month = d.toLocaleString('en-GB', { month: 'short' }); // "Dec", "Jan"
        const year = d.getFullYear();
        return includeOf ? `${day} of ${month} ${year}` : `${day} ${month} ${year}`;
    }

    document.addEventListener("DOMContentLoaded", () => {

        const banners = document.querySelectorAll(".factory-closure-banner");
        banners.forEach(banner => {
            const text = banner.querySelector(".banner-text");
            if (!text) return;

            if (today >= bannerStart && today <= bannerEnd) {
                const bannerText = `ⓘ Our office will be closed between ${formatDate(breakStart)} and ${formatDate(breakEnd)}. We appreciate your patience and will respond as soon as we return.`;
                text.textContent = bannerText;
                banner.style.display = "block";
            } else {
                banner.style.display = "none";
            }
        });
    });

    function dismissBanner() {
        document.querySelectorAll(".factory-closure-banner").forEach(b => b.style.display = "none");
    }
</script>
