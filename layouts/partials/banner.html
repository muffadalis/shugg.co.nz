<div id="factory-closure-banner">
    <span id="banner-text">⚠️ Factory closed</span>
    <button onclick="dismissBanner()" class="dismiss-btn">Dismiss</button>
</div>

<style>
    #factory-closure-banner {
        background-color: #b71c1c;
        color: white;
        text-align: center;
        padding: 12px;
        font-family: sans-serif;
    }

    .dismiss-btn {
        margin-left: 15px;
        background: rgba(255, 255, 255, 0.2);
        border: none;
        color: white;
        padding: 5px 10px;
        cursor: pointer;
        font-weight: normal;
        border-radius: 3px;
    }

    .dismiss-btn:hover {
        background: rgba(255, 255, 255, 0.3);
    }
</style>

<script>
    //--------------------------------------------------------------------------
    //  Configuration - set your banner and break dates here
    //--------------------------------------------------------------------------
    const bannerStart = new Date("2025-12-1");
    const bannerEnd = new Date("2026-01-10");

    const breakStart = new Date("2025-12-22");
    const breakEnd = new Date("2026-01-9");
    //--------------------------------------------------------------------------

    const today = new Date();
    const bannerDismissed = localStorage.getItem("factoryBannerDismissed");

    // simple ordinal helper
    function ordinal(n) {
        const s = ["th","st","nd","rd"];
        const v = n % 100;
        return n + (s[(v-20)%10] || s[v] || s[0]);
    }

    // format like "22nd Dec 2025" or "9th of Jan 2026" when includeOf=true
    function formatDate(d, includeOf = false) {
        const day = ordinal(d.getDate());
        const month = d.toLocaleString('en-GB', { month: 'short' }); // "Dec", "Jan"
        const year = d.getFullYear();
        return includeOf ? `${day} of ${month} ${year}` : `${day} ${month} ${year}`;
    }

    document.addEventListener("DOMContentLoaded", () => {
        const banner = document.getElementById("factory-closure-banner");
        const text = document.getElementById("banner-text");

        if (!banner || !text) return;

        if (today >= bannerStart && today <= bannerEnd) {
            var bannerText = `⚠️ Factory closed on ${formatDate(breakStart)} to ${formatDate(breakEnd)}.`
            text.textContent = bannerText;
            console.log(bannerText);
            banner.style.display = "block";
        } else {
            console.log("Banner is no longer active.");
            banner.style.display = "none";
        }
    });

    function dismissBanner() {
        const banner = document.getElementById("factory-closure-banner");
        if (banner) banner.style.display = "none";
        localStorage.setItem("factoryBannerDismissed", "true");
    }
</script>
