<!DOCTYPE html>
<html lang="en">
<head>
  {{ partial "head.html" . }}
</head>

<body class="index-page">
  {{ partial "banner.html" . }}

  {{ partial "header.html" . }}

  <main class="main">

{{ if not (eq .Kind "home") }}
    <!-- Page Title -->
    <div class="page-title light-background d-print-none">
      <div class="container d-lg-flex justify-content-between align-items-center">
        <div class="mb-2">
      <h1 class="mb-1">{{ .Title }}</h1>
      <div class="fs-5 fst-italic">{{ .Description }}</div>
    </div>
        <nav class="breadcrumbs">
          <ol>
            <li><a href="{{ "/" | relURL }}">Home</a></li>
            <li class="current">{{ .Title }}</li>
          </ol>
        </nav>
      </div>
    </div><!-- End Page Title -->
{{ end }}


  {{ block "main" . }}{{ end }}

  </main>

  {{ partial "footer.html" . }}

  {{ partial "scripts.html" . }}

</body>

</html>
