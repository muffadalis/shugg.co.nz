{{ define "main" }}
<section id="services" class="services section">

    <div class="container">

        <div class="row gy-3">
            {{ range .Pages }}
            <div class="col-md-4" data-aos="fade-up" data-aos-delay="100">
                <div class="service-item d-flex align-items-center position-relative" style="padding: 0.9rem;">
                    {{ with index .Params.image 0 }}
                    <img class="flex-shrink-0 me-3" src="{{ . | relURL }}" alt="{{ $.Title }}" width="100" height="180">
                    {{ end }}
                    <div class="d-flex flex-column justify-content-center">
                        <h4 class="title mb-1">
                            <a href="{{ .RelPermalink }}" class="stretched-link">{{ .Title }}</a>
                        </h4>
                        <p class="fs-6 fst-italic">{{ .Params.description }}</p>
                    </div>
                </div>
            </div>
            {{ end }}
        </div>

    </div>

</section><!-- /Services Section -->
{{ end }}
