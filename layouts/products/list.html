{{ define "main"}}
<section id="services" class="services section">

    <div class="container">

        <div class="row gy-4">
            {{ range .Pages }}
            <div class="col-md-6" data-aos="fade-up" data-aos-delay="100">
                <div class="service-item d-flex align-items-start position-relative h-100">
                    {{ with .Params.image }}
                    <img class="flex-shrink-0 me-3" src="{{ . | relURL }}" alt="{{ $.Title }}" height="100">
                    {{ end }}
                    <div>
                        <h4 class="title">
                            <a href="{{ .RelPermalink }}" class="stretched-link">{{ .Title }}</a>
                        </h4>
                        <p>{{ .Params.description }}</p>
                    </div>
                </div>
            </div>
            {{ end }}

        </div>

    </div>

</section><!-- /Services Section -->
{{end }}
